<svg xmlns="http://www.w3.org/2000/svg" width="160" height="134" viewBox="0 0 160 134">
  <defs>
    <radialGradient id="r" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F04A45"/>
      <stop offset="1" stop-color="#D12624"/>
