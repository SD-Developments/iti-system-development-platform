    <circle cx="33" cy="54" r="10.2" fill="url(#r)"/>
    <circle cx="66" cy="68" r="10.2" fill="url(#r)"/>
    <circle cx="33" cy="98" r="10.2" fill="url(#r)"/>
    <circle cx="66" cy="109" r="10.2" fill="url(#r)"/>

    <circle cx="91" cy="29" r="10.2" fill="url(#n)"/>
    <circle cx="91" cy="69" r="7.4" fill="url(#n)"/>

    <circle cx="129" cy="48" r="10.2" fill="url(#t)"/>
